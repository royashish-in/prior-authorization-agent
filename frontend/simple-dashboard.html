<!DOCTYPE html>
<html>
<head>
    <title>Prior Authorization Agent</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header {
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        .header h1 { color: #2c3e50; font-size: 2.5em; margin-bottom: 10px; }
        .header p { color: #7f8c8d; font-size: 1.1em; }
        
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }
        
        .login-card { max-width: 400px; margin: 50px auto; }
        .login-card h2 { text-align: center; margin-bottom: 20px; color: #2c3e50; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #667eea; }
        input:checked + .slider:before { transform: translateX(26px); }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .status-submitted { background: #ffeaa7; color: #2d3436; }
        .status-approved { background: #00b894; color: white; }
        .status-denied { background: #e17055; color: white; }
        .status-in_review { background: #74b9ff; color: white; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-full { grid-column: 1 / -1; }
        
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: 500;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .hidden { display: none !important; }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .navbar h2 { color: #2c3e50; }
        
        .engine-toggle {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.1);
            padding: 10px 15px;
            border-radius: 25px;
        }
        .engine-label { font-weight: 600; color: #2c3e50; }
        
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .container { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏥 Prior Authorization Agent</h1>
            <p>AI-Powered Healthcare Authorization System</p>
        </div>
        
        <!-- Login Form -->
        <div id="login-form">
            <div class="card login-card">
                <h2>🔐 Provider Login</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="form-control" value="provider1">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" value="provider123">
                </div>
                <button type="button" class="btn btn-primary" style="width: 100%;" onclick="login()">Login</button>
                <div id="message"></div>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="hidden">
            <div class="navbar">
                <h2>📊 Provider Dashboard</h2>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <div class="engine-toggle">
                        <span class="engine-label">🤖 AI Engine</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="llm-toggle" checked>
                            <span class="slider"></span>
                        </label>
                        <span class="engine-label">📋 Rules</span>
                    </div>
                    <button class="btn btn-secondary" onclick="logout()">Logout</button>
                </div>
            </div>
            
            <div class="grid">
                <div class="card">
                    <h3>📝 Submit Authorization Request</h3>
                    <div class="form-group">
                        <label>Test Case</label>
                        <select id="test-case" class="form-control" onchange="loadTestCase()">
                            <option value="positive">✅ Positive - Shoulder MRI (Approved)</option>
                            <option value="negative">❌ Negative - Cosmetic Procedure (Denied)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Patient ID</label>
                        <input type="text" id="patient-id" class="form-control" value="enc_pat_test123">
                    </div>
                    <div class="form-group">
                        <label>Diagnosis Code (ICD-10)</label>
                        <input type="text" id="diagnosis-code" class="form-control" value="M25.511" placeholder="e.g., M25.511">
                    </div>
                    <div class="form-group">
                        <label>Procedure Code (CPT)</label>
                        <input type="text" id="procedure-code" class="form-control" value="73221" placeholder="e.g., 73221">
                    </div>
                    <div class="form-group">
                        <label>Clinical Notes</label>
                        <textarea id="clinical-notes" class="form-control" style="height: 100px;" placeholder="Enter clinical justification...">Patient reports persistent shoulder pain for 6 weeks following sports injury. Conservative treatment with NSAIDs and physical therapy has provided minimal relief. MRI needed to evaluate for rotator cuff tear or labral pathology.</textarea>
                    </div>
                    <button class="btn btn-primary" onclick="submitRequest()">🚀 Submit Request</button>
                    <div id="submit-message"></div>
                </div>
                
                <div class="card">
                    <h3>📋 Recent Requests</h3>
                    <button class="btn btn-success" onclick="loadRequests()" style="margin-bottom: 15px;">🔄 Refresh</button>
                    <div id="requests-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let authToken = null;
        
        function login() {
            fetch('http://127.0.0.1:8000/api/v1/auth/login-json', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            })
            .then(response => response.json())
            .then(data => {
                authToken = data.access_token;
                document.getElementById('message').innerHTML = '<div class="alert alert-success">✅ Login successful!</div>';
                
                // Show dashboard
                setTimeout(() => {
                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadRequests();
                }, 1000);
            })
            .catch(error => {
                document.getElementById('message').innerHTML = '<div class="alert alert-error">❌ Login failed</div>';
            });
        }
        
        function logout() {
            authToken = null;
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('message').innerHTML = '';
            document.getElementById('submit-message').innerHTML = '';
            document.getElementById('requests-list').innerHTML = '<div style="text-align: center; color: #6c757d; padding: 20px;">Loading...</div>';
            document.getElementById('submit-message').innerHTML = '';
        }
        
        function submitRequest() {
            const useLLM = document.getElementById('llm-toggle').checked; // When checked (right side), use LLM
            const endpoint = useLLM ? 
                'http://127.0.0.1:8000/api/v1/authorization/requests/enhanced?use_llm=true' : 
                'http://127.0.0.1:8000/api/v1/authorization/requests';
            
            const requestData = {
                request_id: `req_${Date.now()}`,
                provider_id: "prov_12345",
                patient_demographics: {
                    patient_id: document.getElementById('patient-id').value,
                    age: 45,
                    gender: "female",
                    insurance_id: "enc_ins_test123",
                    member_id: "enc_mem_test123"
                },
                diagnosis_codes: [{
                    code: document.getElementById('diagnosis-code').value,
                    description: "Pain in right shoulder"
                }],
                procedure_codes: [{
                    code: document.getElementById('procedure-code').value,
                    description: "MRI upper extremity without contrast"
                }],
                clinical_notes: document.getElementById('clinical-notes').value,
                procedure_type: "mri",
                urgency_level: "routine",
                status: "submitted",
                submitted_at: new Date().toISOString(),
                updated_at: new Date().toISOString()
            };
            
            // Add enhanced context for LLM
            if (useLLM) {
                const testCase = document.getElementById('test-case').value;
                if (testCase === 'positive') {
                    requestData.enhanced_context = {
                        patient_history: ["Previous shoulder injury 2019"],
                        current_medications: ["Ibuprofen 600mg TID"],
                        treatment_response: "Minimal improvement with conservative treatment"
                    };
                } else {
                    requestData.enhanced_context = {
                        patient_history: ["No relevant medical history"],
                        current_medications: ["None"],
                        treatment_response: "No prior treatment attempted"
                    };
                }
            }
            
            document.getElementById('submit-message').innerHTML = '<div class="alert alert-info">🔄 Processing request...</div>';
            
            console.log('Sending request to:', endpoint);
            console.log('Request data:', JSON.stringify(requestData, null, 2));
            
            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                },
                body: JSON.stringify(useLLM ? { request_data: requestData } : requestData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        console.error('Full server response:', text);
                        try {
                            const errorData = JSON.parse(text);
                            console.error('Parsed error:', errorData);
                        } catch (e) {
                            console.error('Could not parse error response');
                        }
                        throw new Error(`HTTP ${response.status}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                console.log('API Response:', data);
                const engineType = useLLM ? '🤖 AI-Enhanced' : '📋 Rule-Based';
                const requestId = data.request_id || data.id || 'N/A';
                
                let llmSection = '';
                if (useLLM) {
                    const llmCall = {
                        model: "google/flan-t5-large",
                        endpoint: "https://api-inference.huggingface.co/models/google/flan-t5-large",
                        parameters: {
                            max_length: 512,
                            temperature: 0.7,
                            do_sample: true
                        }
                    };
                    
                    const llmInput = {
                        patient_age: requestData.patient_demographics.age,
                        diagnosis: requestData.diagnosis_codes.map(d => d.code + ': ' + d.description),
                        procedure: requestData.procedure_codes.map(p => p.code + ': ' + p.description),
                        clinical_notes: requestData.clinical_notes,
                        enhanced_context: requestData.enhanced_context
                    };
                    
                    const llmOutput = {
                        decision: data.status,
                        message: data.message,
                        timestamp: data.timestamp,
                        rationale: data.rationale || 'No detailed rationale provided'
                    };
                    
                    console.log('🤖 LLM Rationale:', data.rationale);
                    
                    llmSection = `
                        <div style="margin-top:15px;padding:10px;border:1px solid #28a745;border-radius:8px;background:#f8fff9;">
                            <h4 style="margin:0 0 10px 0;color:#155724;">🤖 LLM Processing Details</h4>
                            <div style="margin-bottom:10px;"><strong>Model Called:</strong> ${llmCall.model}</div>
                            <div style="margin-bottom:10px;"><strong>Parameters:</strong> <code style="background:#e9ecef;padding:2px 4px;border-radius:3px;">${JSON.stringify(llmCall.parameters)}</code></div>
                            <details style="margin:5px 0;">
                                <summary style="cursor:pointer;font-weight:bold;">📥 Input Data</summary>
                                <pre style="background:#f8f9fa;padding:8px;border-radius:4px;font-size:11px;margin:5px 0;overflow-x:auto;">${JSON.stringify(llmInput, null, 2)}</pre>
                            </details>
                            <details style="margin:5px 0;">
                                <summary style="cursor:pointer;font-weight:bold;">📤 Output Data</summary>
                                <pre style="background:#f8f9fa;padding:8px;border-radius:4px;font-size:11px;margin:5px 0;overflow-x:auto;">${JSON.stringify(llmOutput, null, 2)}</pre>
                            </details>
                        </div>`;
                }
                
                document.getElementById('submit-message').innerHTML = 
                    `<div class="alert alert-success">✅ Request submitted successfully!<br>
                     <strong>ID:</strong> ${requestId}<br>
                     <strong>Status:</strong> ${data.status || 'submitted'}<br>
                     <strong>Engine:</strong> ${engineType}${llmSection}</div>`;
                loadRequests();
            })
            .catch(error => {
                console.error('Request failed:', error);
                document.getElementById('submit-message').innerHTML = 
                    `<div class="alert alert-error">❌ Request submission failed<br>
                     <small>Error: ${error.message}</small><br>
                     <small>Check console for details</small></div>`;
            });
        }
        
        function loadTestCase() {
            const testCase = document.getElementById('test-case').value;
            if (testCase === 'positive') {
                document.getElementById('diagnosis-code').value = 'M25.511';
                document.getElementById('procedure-code').value = '73221';
                document.getElementById('clinical-notes').value = 'Patient reports persistent shoulder pain for 6 weeks following sports injury. Conservative treatment with NSAIDs and physical therapy has provided minimal relief. MRI needed to evaluate for rotator cuff tear or labral pathology.';
            } else {
                document.getElementById('diagnosis-code').value = 'Z41.1';
                document.getElementById('procedure-code').value = '15823';
                document.getElementById('clinical-notes').value = 'Patient requests cosmetic breast augmentation for aesthetic enhancement. No medical necessity documented.';
            }
        }
        
        function loadRequests() {
            const list = document.getElementById('requests-list');
            list.innerHTML = '<div>Loading...</div>';
            
            fetch('http://127.0.0.1:8000/api/v1/authorization/requests?provider_id=prov_12345', {
                headers: { 'Authorization': `Bearer ${authToken}` }
            })
            .then(response => response.json())
            .then(data => {
                list.innerHTML = `<div>Found ${data.total_requests} requests</div>`;
                setTimeout(() => {
                    if (data.requests && data.requests.length > 0) {
                        list.innerHTML = data.requests.map(req => 
                            `<div style="border: 1px solid #e1e8ed; margin: 10px 0; padding: 15px; border-radius: 8px; background: #f8f9fa;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                    <strong style="color: #2c3e50;">${req.request_id}</strong>
                                    <span class="status-badge status-${req.status}">${req.status}</span>
                                </div>
                                <div style="font-size: 14px; color: #6c757d;">
                                    📅 ${new Date(req.submitted_at).toLocaleString()}
                                </div>
                                <div style="margin-top: 8px;">
                                    <span style="background: #e9ecef; padding: 2px 8px; border-radius: 4px; font-size: 12px;">
                                        Progress: ${req.progress_percentage || 0}%
                                    </span>
                                </div>
                                <div style="margin-top: 10px; padding: 8px; background: #fff; border-radius: 4px; border-left: 3px solid #28a745;">
                                    <div style="font-size: 12px; font-weight: bold; color: #155724; margin-bottom: 4px;">🤖 AI Rationale:</div>
                                    <div style="font-size: 12px; color: #495057; line-height: 1.4;">
                                        ${req.rationale || 'Detailed medical rationale available via decision explanation endpoint'}
                                    </div>
                                </div>
                            </div>`
                        ).join('');
                    }
                }, 100);
            })
            .catch(error => {
                list.innerHTML = '<div>Error: ' + error.message + '</div>';
            });
        }
    </script>
</body>
</html>
