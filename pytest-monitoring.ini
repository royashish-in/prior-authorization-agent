[pytest]
# Pytest configuration with test monitoring enabled
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    -v
    --tb=short
    --maxfail=10
    --durations=20
    --disable-warnings
    -p tests.utils.test_monitoring
markers =
    unit: Unit tests - isolated tests for individual functions/methods with no external dependencies
    integration: Integration tests - tests that verify interaction between multiple components or external services
    performance: Performance tests - tests that measure system performance, load handling, and response times
    security: Security tests - tests that verify authentication, authorization, PHI protection, and compliance
    slow: Slow running tests - tests that take longer than 30 seconds to complete
    fast: Fast unit tests - tests that should complete within 5 seconds
    optimized: Tests using performance optimizations like in-memory databases and fast mocks
    memory_intensive: Tests that use significant memory resources
    concurrent: Tests that run concurrent operations
    external: Tests that require external services
    asyncio: Async tests - tests that use asyncio and async/await patterns (automatically applied by pytest-asyncio)
    monitored: Tests that are actively monitored for performance and reliability
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Performance monitoring settings
cache_dir = .pytest_cache
filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning
    ignore::ResourceWarning
    ignore:.*unclosed.*:ResourceWarning
    ignore:.*json_encoders.*is deprecated:pydantic.warnings.PydanticDeprecatedSince20
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::UserWarning:sqlalchemy
    ignore::FutureWarning
# Test monitoring configuration
junit_family = xunit2
junit_logging = all
junit_log_passing_tests = true