name: Deploy Prior Authorization Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: prior-auth-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  build:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.build-image.outputs.image-uri }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image-uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-staging:
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name prior-auth-cluster-staging

    - name: Deploy to staging
      env:
        IMAGE_URI: ${{ needs.build.outputs.image-uri }}
        ENVIRONMENT: staging
      run: |
        # Update image in deployment manifest
        sed -i "s|image: prior-auth-api:latest|image: $IMAGE_URI|g" deployment/k8s/app-deployment.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f deployment/k8s/namespace.yaml
        kubectl apply -f deployment/k8s/secrets.yaml
        kubectl apply -f deployment/k8s/configmap.yaml
        kubectl apply -f deployment/k8s/postgres-deployment.yaml
        kubectl apply -f deployment/k8s/redis-deployment.yaml
        kubectl apply -f deployment/k8s/app-deployment.yaml
        kubectl apply -f deployment/k8s/ingress.yaml
        
        # Wait for deployment
        kubectl rollout status deployment/prior-auth-api -n prior-auth --timeout=600s

    - name: Run database migrations
      run: |
        POD_NAME=$(kubectl get pods -n prior-auth -l app=prior-auth-api -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n prior-auth $POD_NAME -- python -m alembic upgrade head

    - name: Health check
      run: |
        kubectl port-forward service/prior-auth-api-service 8080:80 -n prior-auth &
        sleep 10
        curl -f http://localhost:8080/health || exit 1

  deploy-production:
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment == 'production'
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name prior-auth-cluster

    - name: Deploy to production
      env:
        IMAGE_URI: ${{ needs.build.outputs.image-uri }}
        ENVIRONMENT: production
      run: |
        # Update image in deployment manifest
        sed -i "s|image: prior-auth-api:latest|image: $IMAGE_URI|g" deployment/k8s/app-deployment.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f deployment/k8s/namespace.yaml
        kubectl apply -f deployment/k8s/secrets.yaml
        kubectl apply -f deployment/k8s/configmap.yaml
        kubectl apply -f deployment/k8s/postgres-deployment.yaml
        kubectl apply -f deployment/k8s/redis-deployment.yaml
        kubectl apply -f deployment/k8s/app-deployment.yaml
        kubectl apply -f deployment/k8s/ingress.yaml
        
        # Wait for deployment
        kubectl rollout status deployment/prior-auth-api -n prior-auth --timeout=600s

    - name: Run database migrations
      run: |
        POD_NAME=$(kubectl get pods -n prior-auth -l app=prior-auth-api -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n prior-auth $POD_NAME -- python -m alembic upgrade head

    - name: Health check
      run: |
        kubectl port-forward service/prior-auth-api-service 8080:80 -n prior-auth &
        sleep 10
        curl -f http://localhost:8080/health || exit 1

    - name: Notify deployment success
      if: success()
      run: |
        echo "Production deployment successful!"
        # Add notification logic here (Slack, email, etc.)

    - name: Rollback on failure
      if: failure()
      run: |
        echo "Production deployment failed, initiating rollback..."
        kubectl rollout undo deployment/prior-auth-api -n prior-auth
        kubectl rollout status deployment/prior-auth-api -n prior-auth