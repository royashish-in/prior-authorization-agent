apiVersion: v1
kind: ResourceQuota
metadata:
  name: llm-service-quota
  namespace: prior-auth
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 80Gi
    requests.nvidia.com/gpu: "10"
    limits.cpu: "40"
    limits.memory: 160Gi
    limits.nvidia.com/gpu: "10"
    pods: "20"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: llm-service-limits
  namespace: prior-auth
spec:
  limits:
  - default:
      cpu: "4"
      memory: "16Gi"
      nvidia.com/gpu: "1"
    defaultRequest:
      cpu: "2"
      memory: "8Gi"
      nvidia.com/gpu: "1"
    type: Container
  - max:
      cpu: "8"
      memory: "32Gi"
      nvidia.com/gpu: "2"
    min:
      cpu: "1"
      memory: "4Gi"
    type: Container
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: llm-service-priority
value: 1000
globalDefault: false
description: "Priority class for LLM services"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-service-pdb
  namespace: prior-auth
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: llm-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-optimization-config
  namespace: prior-auth
data:
  optimization.yaml: |
    # Resource optimization configuration
    gpu_memory_fraction: 0.9
    model_parallel: true
    batch_size_optimization: true
    dynamic_batching:
      enabled: true
      max_batch_size: 8
      max_delay_ms: 100
    
    # Model caching strategy
    model_cache:
      enabled: true
      max_models: 3
      eviction_policy: "lru"
      preload_models:
        - "microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext"
        - "emilyalsentzer/Bio_ClinicalBERT"
    
    # Performance tuning
    inference_optimization:
      use_torch_compile: true
      use_flash_attention: true
      quantization: "int8"
      tensor_parallel_size: 1
    
    # Auto-scaling parameters
    scaling:
      target_gpu_utilization: 70
      target_memory_utilization: 80
      scale_up_threshold: 85
      scale_down_threshold: 30
      cooldown_period: 300
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-monitoring
  namespace: prior-auth
spec:
  selector:
    matchLabels:
      name: gpu-monitoring
  template:
    metadata:
      labels:
        name: gpu-monitoring
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: nvidia-dcgm-exporter
        image: nvcr.io/nvidia/k8s/dcgm-exporter:3.1.7-3.1.4-ubuntu20.04
        ports:
        - name: metrics
          containerPort: 9400
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      nodeSelector:
        accelerator: nvidia-tesla-v100