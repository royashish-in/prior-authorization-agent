apiVersion: v1
kind: ServiceMonitor
metadata:
  name: llm-service-monitor
  namespace: prior-auth
  labels:
    app: llm-service
spec:
  selector:
    matchLabels:
      app: llm-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llm-service-alerts
  namespace: prior-auth
  labels:
    app: llm-service
spec:
  groups:
  - name: llm-service.rules
    rules:
    - alert: LLMServiceDown
      expr: up{job="llm-service"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "LLM Service is down"
        description: "LLM Service has been down for more than 1 minute"
    
    - alert: LLMHighLatency
      expr: histogram_quantile(0.95, rate(llm_request_duration_seconds_bucket[5m])) > 30
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "LLM Service high latency"
        description: "95th percentile latency is above 30 seconds"
    
    - alert: LLMHighErrorRate
      expr: rate(llm_requests_total{status=~"5.."}[5m]) / rate(llm_requests_total[5m]) > 0.1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "LLM Service high error rate"
        description: "Error rate is above 10%"
    
    - alert: LLMHighMemoryUsage
      expr: container_memory_usage_bytes{pod=~"llm-service-.*"} / container_spec_memory_limit_bytes > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "LLM Service high memory usage"
        description: "Memory usage is above 90%"
    
    - alert: LLMGPUUtilizationHigh
      expr: nvidia_gpu_utilization > 95
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "GPU utilization is very high"
        description: "GPU utilization has been above 95% for 10 minutes"
    
    - alert: LLMModelLoadFailure
      expr: increase(llm_model_load_failures_total[5m]) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "LLM model load failure"
        description: "Failed to load LLM model"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-llm-dashboard
  namespace: prior-auth
data:
  llm-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "LLM Service Dashboard",
        "tags": ["llm", "ai", "prior-auth"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(llm_requests_total[5m])",
                "legendFormat": "{{method}} {{status}}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(llm_request_duration_seconds_bucket[5m]))",
                "legendFormat": "95th percentile"
              },
              {
                "expr": "histogram_quantile(0.50, rate(llm_request_duration_seconds_bucket[5m]))",
                "legendFormat": "50th percentile"
              }
            ]
          },
          {
            "id": 3,
            "title": "GPU Utilization",
            "type": "graph",
            "targets": [
              {
                "expr": "nvidia_gpu_utilization",
                "legendFormat": "GPU {{gpu}}"
              }
            ]
          },
          {
            "id": 4,
            "title": "Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{pod=~\"llm-service-.*\"} / 1024 / 1024 / 1024",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "id": 5,
            "title": "Model Performance",
            "type": "table",
            "targets": [
              {
                "expr": "llm_model_inference_time_seconds",
                "legendFormat": "{{model_name}}"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }